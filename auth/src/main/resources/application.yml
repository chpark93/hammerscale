      host: localhost
      port: 6379
      password: ""

hammerscale:
  jwt:
    secret: "your-256-bit-secret-key-change-in-production-minimum-32-chars"
    access-ttl-seconds: 900
    refresh-ttl-seconds: 604800
  admin:
    secret: ""
